# CI for the Laravel firewall on PHP '8.2', '8.3', '8.4', '8.5'.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, sodium, intl
          tools: composer:v2
          coverage: none
      - name: Validate
        run: composer validate --strict
      - name: Install
        run: composer install --no-interaction --no-progress
      - name: Tests
        run: vendor/bin/phpunit
